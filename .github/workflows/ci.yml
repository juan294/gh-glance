name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs rather than floating major tags: a tag
# is retargetable by its owner at any moment, and release.yml holds an OIDC
# token with publish rights. The trailing version comment is what makes a
# Dependabot SHA bump reviewable, so it is load-bearing rather than decoration.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Without this the first version to fail cancels the others, which
      # destroys exactly the signal a matrix exists to produce.
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Until this job existed, no function body in index.mjs was executed by
      # any gate -- every smoke check below returns from the argv block long
      # before render(), so a green tick meant only "this file parses".
      - run: npm test

  # The dashboard is a single ESM script with no build step, so the remaining
  # version-dependent checks are that it parses and boots on every supported
  # Node. 22 is the floor declared in `engines`: ink, cli-truncate and
  # slice-ansi all require >=22, and Node 20 reached end of life on 2026-04-30.
  smoke:
    name: Smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check index.mjs
      - name: CLI boots
        run: |
          node index.mjs --version
          node index.mjs --help
      # This previously asserted only "some non-zero exit", which any startup
      # crash or module-resolution failure would also satisfy. Pin the exact
      # code and a short stable fragment of the message -- short so that
      # rewording the sentence does not red the build.
      - name: Refuses a non-TTY stdout
        run: |
          set +e
          stderr=$(node index.mjs 2>&1 >/dev/null)
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 for a non-TTY stdout, got $code" >&2
            exit 1
          fi
          case "$stderr" in
            *"not a terminal"*) ;;
            *) echo "expected the non-TTY explanation, got: $stderr" >&2; exit 1 ;;
          esac
      - name: Rejects an unknown argument
        run: |
          set +e
          node index.mjs --definitely-not-a-flag >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an unknown argument, got $code" >&2
            exit 1
          fi

  # Run files serially within each shard: individual files already create
  # concurrent panes. The governor file exceeded the old 10-minute per-file
  # runner timeout on 2026-09-23; one serial job took 32 minutes at 144 tests.
  # Isolated runners avoid a timed-out file disrupting later PTY fixtures.
  pty-governor:
    name: PTY governor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1 --test-timeout=900000 test/pty/governor.test.mjs

  pty-rest:
    name: PTY other files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exercise the GNU (util-linux) branch of run.sh while keeping each
      # file serial; the local full suite exercises the BSD branch.
      - run: |
          files=()
          for file in test/pty/*.test.mjs; do
            if [[ "$file" != test/pty/governor.test.mjs ]]; then
              files+=("$file")
            fi
          done
          test "${#files[@]}" -gt 0
          node --test --test-concurrency=1 --test-timeout=900000 "${files[@]}"

  # Keep the existing required `PTY` context on main. A cancelled or failed
  # shard must make it fail, not leave a skipped check that protection accepts.
  pty:
    name: PTY
    needs: [pty-governor, pty-rest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both PTY shards
        env:
          GOVERNOR_RESULT: ${{ needs.pty-governor.result }}
          REST_RESULT: ${{ needs.pty-rest.result }}
        run: |
          if [[ "$GOVERNOR_RESULT" != success || "$REST_RESULT" != success ]]; then
            echo "PTY governor: $GOVERNOR_RESULT; PTY other files: $REST_RESULT" >&2
            exit 1
          fi
