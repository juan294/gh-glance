name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: Which tab?
      options:
        - Actions
        - Issues
        - Pull requests
        - Security
        - Not tab-specific (startup, layout, keybindings, ...)
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. `cd` into a repo with ...
        2. Run `gh-glance`
        3. Press `4`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happened? Include any error message shown in the dashboard, and any stack trace printed after it exits."
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: gh-glance Version
      description: "Output of `gh-glance --version`"
      placeholder: "0.9.1"
    validations:
      required: true

  - type: input
    id: gh-version
    attributes:
      label: gh CLI Version
      description: "Output of `gh --version`"
      placeholder: "gh version 2.62.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: "Output of `node --version` (>=22 required)"
      placeholder: "v22.13.0"
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal & OS
      description: "Terminal emulator, multiplexer (if any), and OS version"
      placeholder: "Ghostty 1.3.1 on macOS 15.0"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Diagnostic report
      description: |
        Output of `gh-glance --doctor`. Optional, but it is the single most
        useful thing you can attach -- it adds what the versions above cannot:
        which hosts `gh` is authenticated for, how the repository target
        resolved and from where, your remaining API budget, and one probe per
        endpoint showing the exact `gh` command sent and how any error was
        classified. That last part is usually what identifies the problem.

        It is safe to paste. Environment values are printed only for a short
        curated list of variables that are themselves the thing being
        diagnosed; everything else is reported as set or not set and never by
        value. Credentials are stripped from proxy and remote URLs, and no API
        response bodies are included.

        It works even when the dashboard does not -- it reports rather than
        exits when `gh` is missing or you are outside a git repository.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: nerd-font
    attributes:
      label: Nerd Font
      options:
        - label: My terminal font is a Nerd Font (status icons render, not blank boxes)

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs that might help.
