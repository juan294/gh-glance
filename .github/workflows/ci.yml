name: CI

# One authoritative candidate selection per release. The `plan` job decides the
# role of this run (scripts/release-candidate.mjs planCi):
#
#   push to develop        full checks only for an authenticated exact Sutura repair
#                          merge; otherwise quick integration checks, or nothing while the
#                          develop -> main release PR is open (its run covers it)
#   PR develop -> main     the release candidate: selected suites plus ONE packed
#                          tarball that every package job and the publisher reuse
#   other PRs              read-only checks; can never produce a publishable artifact
#   push to main           promotion identity only (merge tree == tested tree)
#
# Every job runs only when the plan selected it. `Release candidate` always runs
# and fails if a selected job did not succeed or an unselected one ran, so a
# skipped job can never stand in for missing work. The legacy required context
# names (Lint, Test (Node N), Smoke (Node N), PTY) stay on the jobs that now do
# the selected work until the protection migration retires them. Only
# pull_request runs carry those names and `Release candidate`: a push run on
# the same commit reports under "(push)" names, so its skipped or quicker
# checks can never stand in for the candidate's in branch protection.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Supersede older runs for the same PR or branch. Publication lives in
# release.yml and is never cancelled from here.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs rather than floating major tags: a tag
# is retargetable by its owner at any moment, and release.yml holds an OIDC
# token with publish rights. The trailing version comment is what makes a
# Dependabot SHA bump reviewable, so it is load-bearing rather than decoration.
# Runtime pins (Node 22.22.2 / 24.21.0, npm 11.21.0) are held to
# scripts/release-candidate.mjs PINS by test/workflows.test.mjs.
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      jobs: ${{ steps.plan.outputs.jobs }}
      terminal-os: ${{ steps.plan.outputs.terminal-os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: Plan
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/release-candidate.mjs plan-ci

  lint:
    name: ${{ github.event_name == 'pull_request' && 'Lint' || 'Lint (push)' }}
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'lint')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: ${{ github.event_name == 'pull_request' && 'Lint' || 'Lint (push)' }}
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --check index.mjs

  # The candidate's one pack. Pinned Node and npm, locked install, one
  # `npm pack --ignore-scripts`, then the tarball and its immutable input
  # manifest are uploaded once (never overwritten) for 30 days.
  pack:
    name: Pack candidate
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pack')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      tarball-sha256: ${{ steps.manifest.outputs.tarball-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: Pack candidate
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npx -y npm@11.21.0 install -g npm@11.21.0 && npm --version
      - run: npm ci
      - run: node scripts/release-candidate.mjs pack candidate
      - id: manifest
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: node scripts/release-candidate.mjs manifest candidate/artifact.tgz candidate/manifest.json
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.manifest.outputs.artifact-name }}
          path: |
            candidate/artifact.tgz
            candidate/manifest.json
          retention-days: 30
          overwrite: false
          if-no-files-found: error

  test:
    name: ${{ github.event_name == 'pull_request' && format('Test (Node {0})', matrix.node) || format('Test (Node {0}, push)', matrix.node) }}
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Without this the first version to fail cancels the others, which
      # destroys exactly the signal a matrix exists to produce.
      fail-fast: false
      # The context name keeps the major ("Test (Node 22)") because main's
      # protection requires it; the exact pinned runtime is the version.
      matrix:
        include:
          - { node: 22, node-version: 22.22.2 }
          - { node: 24, node-version: 24.21.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: ${{ github.event_name == 'pull_request' && format('Test (Node {0})', matrix.node) || format('Test (Node {0}, push)', matrix.node) }}
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: node scripts/test-select.mjs run fast

  # The package selection on each supported Node: exact five files and bytes,
  # installed bin, version/help, blocked imports, the original smoke's refusals
  # (exit 1 non-TTY, exit 2 unknown flag) and the installed collector routes. A
  # candidate run checks the one uploaded tarball, downloaded by ID and
  # hard-checked against the pack job's digest, and may never repack; other
  # runs let the test pack privately.
  smoke:
    name: ${{ github.event_name == 'pull_request' && format('Smoke (Node {0})', matrix.node) || format('Smoke (Node {0}, push)', matrix.node) }}
    needs: [plan, pack]
    if: >-
      always() && contains(fromJSON(needs.plan.outputs.jobs), 'smoke') &&
      (needs.pack.result == 'success' || needs.pack.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The context name keeps the major ("Smoke (Node 22)") because main's
      # protection requires it; the exact pinned runtime is the version.
      matrix:
        include:
          - { node: 22, node-version: 22.22.2 }
          - { node: 24, node-version: 24.21.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: ${{ github.event_name == 'pull_request' && format('Smoke (Node {0})', matrix.node) || format('Smoke (Node {0}, push)', matrix.node) }}
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - if: needs.pack.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          path: candidate
          digest-mismatch: error
      - if: needs.pack.result == 'success'
        env:
          EXPECTED_SHA256: ${{ needs.pack.outputs.tarball-sha256 }}
        run: node scripts/release-candidate.mjs use-candidate candidate
      - run: node scripts/test-select.mjs run package

  # Startup, Actions rows, navigation, quit, cached age and Paused -> Watching
  # recovery against the installed candidate on GNU (Linux) script(1), and on
  # BSD (macOS) for release candidates.
  terminal-smoke:
    name: Terminal smoke (${{ matrix.os }})
    needs: [plan, pack]
    if: >-
      always() && contains(fromJSON(needs.plan.outputs.jobs), 'terminal-smoke') &&
      (needs.pack.result == 'success' || needs.pack.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.terminal-os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: Terminal smoke (${{ matrix.os }})
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - if: needs.pack.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          path: candidate
          digest-mismatch: error
      - if: needs.pack.result == 'success'
        env:
          EXPECTED_SHA256: ${{ needs.pack.outputs.tarball-sha256 }}
        run: node scripts/release-candidate.mjs use-candidate candidate --install
      - env:
          GH_GLANCE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: node scripts/test-select.mjs run pty:smoke
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-smoke-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: ignore

  # The 72-hour recovery oracle and the simulated-hour efficiency acceptance,
  # once, on Node 22. The runner keeps going after a failure and fails if
  # either selection did.
  sustained:
    name: Recovery and efficiency
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'sustained')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: Recovery and efficiency
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: node scripts/test-select.mjs run recovery efficiency

  # Full terminal suite in two shards (scripts/test-select.mjs pty:governor and
  # pty:rest, which together must equal the full selection), files serial
  # within each: individual files already create concurrent panes. The governor
  # file exceeded the old 10-minute per-file runner timeout on 2026-09-23;
  # isolated runners avoid a timed-out file disrupting later PTY fixtures.
  # Exercises the GNU branch of run.sh.
  pty-governor:
    name: PTY governor
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pty-governor')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: PTY governor
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - env:
          GH_GLANCE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: node scripts/test-select.mjs run pty:governor
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pty-governor-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: ignore

  pty-rest:
    name: PTY other files
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'pty-rest')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: PTY other files
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - env:
          GH_GLANCE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: node scripts/test-select.mjs run pty:rest
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pty-rest-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: ignore

  # Legacy required `PTY` context on PRs; exact repair merges also run the
  # push context. Ordinary develop push cadence remains unchanged. Protection reads it
  # there). It reports the terminal work this run selected: the full shards
  # for broad candidates, the smoke otherwise. A job skipped by its `if` still
  # posts a check run, so push runs name it "PTY (push)".
  pty:
    name: ${{ github.event_name == 'pull_request' && 'PTY' || 'PTY (push)' }}
    needs: [plan, terminal-smoke, pty-governor, pty-rest]
    if: always() && (github.event_name == 'pull_request' || fromJSON(needs.plan.outputs.plan).repairIntegration == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: ${{ github.event_name == 'pull_request' && 'PTY' || 'PTY (push)' }}
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_ONLY: terminal-smoke,pty-governor,pty-rest
        run: node scripts/release-candidate.mjs aggregate

  promotion:
    name: Promotion identity
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'promotion')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: Promotion identity
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs verify-promotion "$GITHUB_SHA"

  candidate:
    name: ${{ github.event_name == 'pull_request' && 'Release candidate' || 'Push checks' }}
    needs: [plan, lint, pack, test, smoke, terminal-smoke, sustained, pty-governor, pty-rest, pty, promotion]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      # Immutable checkout proof is uploaded before any candidate-owned command.
      - name: Record native checkout before verification
        env:
          SUTURA_NATIVE_JOB_KEY: ${{ github.event_name == 'pull_request' && 'Release candidate' || 'Push checks' }}
          SUTURA_NATIVE_RECORD: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const testedSha = cp.execFileSync('git', ['--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(testedSha)) throw new Error('Exact native checkout unavailable');
          fs.writeFileSync(process.env.SUTURA_NATIVE_RECORD, JSON.stringify({ schemaVersion: 'sutura-native-checkout-v1', runId: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), jobKey: process.env.SUTURA_NATIVE_JOB_KEY, testedSha }) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Retain immutable pre-verification checkout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkout-${{ github.job }}-${{ strategy.job-index || 0 }}.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-candidate.mjs aggregate

  native-receipt:
    name: Native proof receipt
    needs: [plan, lint, pack, test, smoke, terminal-smoke, sustained, pty-governor, pty-rest, pty, promotion, candidate]
    if: >-
      always() && (fromJSON(needs.plan.outputs.plan).repairIntegration == true ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'sutura/fix-')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # Isolated producer: no consumer checkout or candidate code execution.
      - name: Read reviewed Sutura receipt implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: juan294/sutura
          ref: 94dab7eab0957d1d2e9e4aab2dc4e2ea9828f07c
          path: .receipt-engine
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
      - name: Read immutable pre-test checkout records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sutura-checkout-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-checkouts
          merge-multiple: true
      # Resolve the actual last policy-file commit, which stays stable while
      # integration advances without changing policy. The existing CLI verifies
      # exact ancestry and identical current/source policy bytes independently.
      - name: Build native receipt from the exact enrolled policy source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          policy_source=$(gh api --hostname github.com "repos/$GITHUB_REPOSITORY/commits?path=.github/native-policy.json&sha=develop&per_page=1" --jq '.[0].sha')
          if ! [[ "$policy_source" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Exact native-policy enrollment commit is unavailable.' >&2
            exit 1
          fi
          node .receipt-engine/scripts/fleet-native-receipt.mjs "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" refs/heads/develop "$RUNNER_TEMP/native-checkouts" "$policy_source" > "$RUNNER_TEMP/native-receipt.json"
      - name: Retain native proof receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sutura-native-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-receipt.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
