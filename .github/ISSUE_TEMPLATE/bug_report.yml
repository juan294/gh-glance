name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: Which tab?
      options:
        - Actions
        - Issues
        - Pull requests
        - Security
        - Not tab-specific (startup, layout, keybindings, ...)
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. `cd` into a repo with ...
        2. Run `gh-glance`
        3. Press `4`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happened? Include any error message shown in the dashboard, and any stack trace printed after it exits."
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: gh-glance Version
      description: "Output of `gh-glance --version`"
      placeholder: "0.3.1"
    validations:
      required: true

  - type: input
    id: gh-version
    attributes:
      label: gh CLI Version
      description: "Output of `gh --version`"
      placeholder: "gh version 2.62.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: "Output of `node --version` (>=22 required)"
      placeholder: "v22.13.0"
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal & OS
      description: "Terminal emulator, multiplexer (if any), and OS version"
      placeholder: "Ghostty 1.3.1 on macOS 15.0"
    validations:
      required: true

  - type: checkboxes
    id: nerd-font
    attributes:
      label: Nerd Font
      options:
        - label: My terminal font is a Nerd Font (status icons render, not blank boxes)

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs that might help.
