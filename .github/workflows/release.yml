name: Release

# Publishes the exact tarball the release pull request tested; it never
# rebuilds, retests or repacks. Three jobs, least privilege first:
#
#   verify    read-only. From a checkout of protected main, proves the tag
#             names the merge commit of this repository's develop -> main
#             release PR before any tagged code runs; then finds
#             the one successful candidate run whose tested merge tree equals
#             that commit's tree, downloads its artifact by ID and checks the
#             archive digest GitHub recorded at upload, the manifest, and the
#             tarball's sha256/sha512. Missing, expired, ambiguous or unequal
#             evidence stops here; there is no repack fallback.
#   publish   the only job with id-token. Runs pinned npm and the verifier from
#             protected main, never candidate code. Publishes ./artifact.tgz
#             with --ignore-scripts only when the registry proves the version
#             absent; exact bytes already present skip to delivery; different
#             bytes, an unknown registry answer or a dist-tag regression block.
#   delivery  no publish credential. Bounded registry readback, provenance
#             bound to these bytes, release.yml at the tag and the merge commit,
#             then one fresh install exercised on Node 22 and 24.
#
# Authentication is OIDC trusted publishing, not a token. There is no NPM_TOKEN
# secret in this repository and there should never be one: npm restricted
# bypass-2FA granular tokens from account management in August 2026 and removes
# their direct-publish ability in January 2027. The trust relationship is
# registered against this repo, THIS FILENAME, and the `npm` environment --
# renaming this file or that environment silently breaks publishing, so change
# either only alongside `npm trust github gh-glance`.
#
# Triggered ONLY by a published release. Adding `push: tags` as well would
# double-publish, and the second run would hard-fail on E403.
on:
  release:
    types: [published]

permissions:
  contents: read

# One publication at a time for the package, and never cancel one in flight.
concurrency:
  group: npm-publish-gh-glance
  cancel-in-progress: false

jobs:
  verify:
    name: Verify candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      integrity: ${{ steps.verify.outputs.integrity }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Bootstrap before any tagged code runs, with the verifier from protected
      # main: the tag must point at the triggering commit, that commit must be
      # on main and be the merge commit of exactly one merged develop -> main
      # PR of this repository (develop commits are ancestors of main too).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: protected-main
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - name: Tag is a protected release merge
        run: node protected-main/scripts/release-candidate.mjs bootstrap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tagged
          fetch-depth: 0
      - id: verify
        working-directory: tagged
        run: node scripts/release-candidate.mjs verify-candidate ../verified
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ github.run_attempt }}
          path: verified/
          retention-days: 30
          overwrite: false
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # Scoped to this job only. The repository default is `contents: read`;
      # granting id-token at workflow level would hand it to every job.
      # This is what mints the OIDC token npm exchanges for publish rights.
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
      EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10.9, which has no OIDC support and fails with a
      # bare 401. Trusted publishing needs >= 11.5.1; the exact pin is a
      # reviewed change, never @latest.
      - run: npm install -g npm@11.21.0 && npm --version
      # By ID, so re-running only this job still finds the verify job's output.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: verified
          digest-mismatch: error
      - name: Same bytes the verifier accepted
        run: node scripts/release-candidate.mjs use-candidate verified
      - id: registry
        run: node scripts/release-candidate.mjs registry-state
      - name: Publish
        if: steps.registry.outputs.action == 'publish'
        # No NODE_AUTH_TOKEN. npm exchanges the OIDC token for a short-lived
        # publish credential and attaches provenance for this workflow run.
        run: npm publish "$GH_GLANCE_PACKAGE_TARBALL" --ignore-scripts --provenance --access public
      # An interrupted or ambiguous publish is "publication unknown": read the
      # registry before anyone retries, and never publish again blindly.
      - name: Read back after a failed publish
        if: failure() && steps.registry.outputs.action == 'publish'
        run: |
          echo "::warning::publication unknown; registry readback follows"
          node scripts/release-candidate.mjs registry-state || true

  delivery:
    name: Delivery
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - run: echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - run: echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
      - run: npm install -g npm@11.21.0
      - name: Registry and provenance readback (five-minute bound)
        env:
          DELIVERY_RECEIPT: ${{ runner.temp }}/delivery-receipt.json
        run: node scripts/release-candidate.mjs deliver
      - name: One fresh install outside the checkout, run on Node 22 and 24
        run: |
          node scripts/package-check.mjs --installed "gh-glance@$RELEASE_VERSION" --expected-version "$RELEASE_VERSION" \
            --node "$NODE22" --node "$NODE24" --report "$RUNNER_TEMP/install.json"
      - if: always()
        run: |
          { echo '```json'; cat "$RUNNER_TEMP/delivery-receipt.json" "$RUNNER_TEMP/install.json" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-receipt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery-receipt.json
            ${{ runner.temp }}/install.json
          retention-days: 90
          if-no-files-found: warn
